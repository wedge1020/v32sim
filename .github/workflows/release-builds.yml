name: Generate Global Binaries

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Purpose of this build run'
        type: choice
        required: true
        default: 'test'
        options:
          - 'test'
          - 'release'
      publish_release:
        description: 'Release runs only: publish the GitHub release at once, instead of leaving it as a draft to review'
        type: boolean
        required: false
        default: false

# Read-only by default; only the release job below can write (create the
# release and attach the zips).
permissions:
  contents: read

# =========================================================================
# CHANGE THIS SINGLE VARIABLE TO DEPLOY THIS WORKFLOW TO ANOTHER REPOSITORY
# =========================================================================
env:
  PROJECT_NAME: v32sim

jobs:
  # Reads the version once, for every build job and the release. The
  # '#define VERSION "..."' line itself is parsed (anchored, as the
  # Makefile does): a plain `grep -i VERSION | head -1` takes the first line
  # that merely mentions the word -- a comment, say. It also checks that
  # `make version` has stamped that version into the .TH line of the man
  # pages (man/v32sim.1, .es.1, .fr.1): a mismatch is a warning on test
  # builds and an error on release builds.
  version:
    name: Read Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse and Check Version
        id: parse
        shell: bash
        run: |
          HEADER_FILE="inc/version.h"
          VERSION=$(sed -n 's/^#define[[:space:]]*VERSION[[:space:]]*"\(.*\)".*/\1/p' "$HEADER_FILE" | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error file=$HEADER_FILE::could not read VERSION from $HEADER_FILE"
            exit 1
          fi
          case "$VERSION" in
            *[!A-Za-z0-9._+-]*)
              echo "::error file=$HEADER_FILE::VERSION '$VERSION' has characters unsafe for file names and tags"
              exit 1 ;;
          esac
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.build_type }}" = "release" ]; then LEVEL=error; else LEVEL=warning; fi
          STALE=0
          for page in man/${{ env.PROJECT_NAME }}*.1; do
            [ -f "$page" ] || continue
            if ! grep -q "^\.TH .*\"${{ env.PROJECT_NAME }} $VERSION\"" "$page"; then
              echo "::$LEVEL file=$page::$page is not stamped with $VERSION (run 'make version')"
              STALE=1
            fi
          done
          if [ "$STALE" = 1 ] && [ "$LEVEL" = error ]; then exit 1; fi

      # A release run needs the release text; stop here, before the build
      # matrix starts, rather than when the release job looks for it.
      - name: Check the Release Text
        if: inputs.build_type == 'release'
        shell: bash
        run: |
          [ -f .github/release-notes.md ] || { echo "::error file=.github/release-notes.md::the release text is missing (is it committed?)"; exit 1; }

  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.os-runner }}

    # The OpenBSD and Haiku targets are a nice extra, not a requirement:
    # if one of them fails, the job still counts as passed, so the release
    # job below goes ahead with every package that did build.
    continue-on-error: ${{ matrix.optional == true }}

    defaults:
      run:
        shell: bash

    env:
      VERSION: ${{ needs.version.outputs.version }}

    strategy:
      fail-fast: false
      matrix:
        # Every native job builds on the machine it targets (no
        # cross-compiling), so it can run `make test` and the --version
        # check on the binary it built. The Raspberry Pi targets are built
        # and tested inside a Debian bookworm container (the Raspberry Pi
        # OS base) run through QEMU, which gives them the matching glibc
        # and a real armhf / arm64 libreadline without multiarch tricks.
        #
        # Linux uses the oldest ubuntu runners, so the binaries need only an
        # older glibc. readline is linked dynamically (a static libreadline
        # also drags in ncurses/tinfo): the machine running v32sim needs the
        # libreadline package (libreadline8 / readline).
        include:
          - os: linux
            arch: x86_64
            os-runner: ubuntu-22.04
          - os: linux
            arch: arm64
            os-runner: ubuntu-22.04-arm

          # Raspberry Pi: 32-bit (armv7, Raspberry Pi OS 32-bit) and 64-bit
          # (armv8, Raspberry Pi OS 64-bit), in a Debian container.
          - os: linux
            arch: armv7-rpi
            os-runner: ubuntu-22.04
            docker-platform: linux/arm/v7
          - os: linux
            arch: armv8-rpi
            os-runner: ubuntu-22.04
            docker-platform: linux/arm64

          # macOS: the system "readline" is libedit; GNU readline from
          # Homebrew is used instead (READLINE_PREFIX, see the Makefile).
          # macos-latest is Apple silicon; macos-15-intel is the Intel runner.
          - os: macos
            arch: arm64
            os-runner: macos-latest
          - os: macos
            arch: x86_64
            os-runner: macos-15-intel

          # OpenBSD and Haiku (optional): built inside a QEMU virtual
          # machine on a Linux runner by cross-platform-actions. GNU readline
          # comes from the package manager (OpenBSD: /usr/local, Haiku:
          # /system/develop). Nobody has to wait for these: a failure does
          # not fail the run.
          - os: openbsd
            arch: x86_64
            os-runner: ubuntu-latest
            vm-arch: x86-64
            vm-version: '7.9'
            optional: true
          - os: haiku
            arch: x86_64
            os-runner: ubuntu-latest
            vm-arch: x86-64
            vm-version: 'r1beta5'
            optional: true

          # Windows (optional, x86_64): built in MSYS2's "MSYS" environment,
          # the POSIX layer (Cygwin-derived) that provides termios, BSD
          # sockets, <regex.h> and SIGBUS, so the sources build unchanged.
          # The binary needs msys-2.0.dll and the readline/ncurses DLLs, which
          # are packed beside it. A native (UCRT64/MinGW) build would need a
          # small Windows layer first (see AGENTS.md, "Releases"). Optional
          # until it has been seen to pass; once it has, add windows-x86_64 to
          # the release job's checklist and drop `optional`. On Windows on
          # ARM the x86_64 zip runs under emulation.
          - os: windows
            arch: x86_64
            os-runner: windows-latest
            optional: true

    defaults:
      run:
        shell: ${{ matrix.os == 'windows' && 'msys2 {0}' || 'bash' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The flex/bison output is committed in gen/ and the Makefile copies it
      # into obj/ when HAVE_GEN_TOOLS=no (below): the result does not depend
      # on which flex/bison the runner has (macOS has an old bison; the VMs
      # have none). `make gen` refreshes gen/ after a .l or .y edit.
      - name: Name the Package
        run: |
          if [ "${{ inputs.build_type }}" = "test" ]; then
            ZIP_NAME="${{ env.PROJECT_NAME }}-${VERSION}-test-${{ matrix.os }}-${{ matrix.arch }}.zip"
            echo "RETENTION_DAYS=2" >> $GITHUB_ENV
          else
            ZIP_NAME="${{ env.PROJECT_NAME }}-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.zip"
            echo "RETENTION_DAYS=0" >> $GITHUB_ENV
          fi
          echo "Packaging: $ZIP_NAME"
          echo "FINAL_ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      # --- ENVIRONMENT SETUP ---
      - name: Install Dependencies (Linux)
        if: matrix.os == 'linux' && !matrix.docker-platform
        run: |
          sudo apt-get update
          sudo apt-get install -y libreadline-dev zip python3
      - name: Install Dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install readline
          echo "READLINE_PREFIX=$(brew --prefix readline)" >> "$GITHUB_ENV"
      - name: Set up QEMU (Raspberry Pi)
        if: matrix.docker-platform
        uses: docker/setup-qemu-action@v3

      # --- BUILD, TEST AND PACKAGE (NATIVE) ---
      - name: Build
        if: matrix.os == 'linux' && !matrix.docker-platform || matrix.os == 'macos'
        run: |
          make HAVE_GEN_TOOLS=no READLINE_PREFIX="$READLINE_PREFIX"
          strip bin/${{ env.PROJECT_NAME }}
          ls -l bin/

      - name: Check the Version
        if: matrix.os == 'linux' && !matrix.docker-platform || matrix.os == 'macos'
        run: |
          OUT=$(./bin/${{ env.PROJECT_NAME }} --version)
          echo "$OUT"
          case "$OUT" in
            *"${VERSION}"*) ;;
            *) echo "::error::--version printed '$OUT', expected it to contain $VERSION"; exit 1 ;;
          esac

      # make test needs only python3 (tests/kbd_probe.py writes its own
      # cartridges); the suites that need the Vircon32 toolchain are not run.
      - name: Test
        if: matrix.os == 'linux' && !matrix.docker-platform || matrix.os == 'macos'
        run: make test HAVE_GEN_TOOLS=no READLINE_PREFIX="$READLINE_PREFIX"

      # `make dist` builds the zip, laid out for
      # <Program Files>/Vircon32/v32tools (see the Makefile):
      #     v32sim                         the binary
      #     LICENSE
      #     docs/v32sim/README*.md         every language, with
      #     docs/v32sim/docs/USAGE*.md     docs/ beside them so links work
      #     docs/v32sim/v32sim*.1          the manual pages (en, es, fr)
      #     tools/v32sim/                  the helper scripts
      - name: Create Zip Archive
        if: matrix.os == 'linux' && !matrix.docker-platform || matrix.os == 'macos'
        run: |
          make dist HAVE_GEN_TOOLS=no READLINE_PREFIX="$READLINE_PREFIX" DISTZIP="$FINAL_ZIP_NAME"
          unzip -l "$FINAL_ZIP_NAME"

      # --- BUILD, TEST AND PACKAGE (WINDOWS, MSYS2 POSIX ENVIRONMENT) ---
      - name: Setup MSYS2 (Windows)
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: gcc make zip unzip python libreadline-devel ncurses-devel
      - name: Build, Test and Package (Windows)
        if: matrix.os == 'windows'
        run: |
          make HAVE_GEN_TOOLS=no
          strip bin/v32sim.exe 2>/dev/null || strip bin/v32sim
          OUT=$(./bin/v32sim --version); echo "$OUT"
          case "$OUT" in *"$VERSION"*) ;; *) echo "::error::--version printed '$OUT', expected $VERSION"; exit 1 ;; esac
          make test HAVE_GEN_TOOLS=no || echo "::warning::make test failed on Windows (MSYS)"
          make dist HAVE_GEN_TOOLS=no DISTZIP="$FINAL_ZIP_NAME"
          # the MSYS runtime DLLs the binary loads, beside it in the zip
          mkdir -p dlls
          ldd bin/v32sim.exe | awk '$3 ~ "^/usr/bin/" { print $3 }' | sort -u | xargs -r -I{} cp {} dlls/
          ls dlls
          (cd dlls && zip -j "../$FINAL_ZIP_NAME" ./*.dll)
          unzip -l "$FINAL_ZIP_NAME"

      # --- BUILD, TEST AND PACKAGE (RASPBERRY PI, IN A CONTAINER) ---
      - name: Build, Test and Package (Raspberry Pi container)
        if: matrix.docker-platform
        run: |
          docker run --rm --platform ${{ matrix.docker-platform }} \
            -v "$PWD:/work" -w /work -e VERSION -e FINAL_ZIP_NAME \
            debian:bookworm bash -ec '
              apt-get update
              apt-get install -y --no-install-recommends build-essential libreadline-dev zip unzip python3
              uname -m
              make HAVE_GEN_TOOLS=no
              strip bin/v32sim
              OUT=$(./bin/v32sim --version); echo "$OUT"
              case "$OUT" in *"$VERSION"*) ;; *) echo "--version printed $OUT, expected $VERSION"; exit 1 ;; esac
              make test HAVE_GEN_TOOLS=no
              make dist HAVE_GEN_TOOLS=no DISTZIP="$FINAL_ZIP_NAME"
              unzip -l "$FINAL_ZIP_NAME"
            '

      # --- OPENBSD / HAIKU (OPTIONAL, IN A VIRTUAL MACHINE) ---
      # The VM is only started for these targets; the next step runs inside
      # it (the checkout is synced in, and the zip back out).
      - name: Start Virtual Machine (OpenBSD / Haiku)
        if: matrix.os == 'openbsd' || matrix.os == 'haiku'
        uses: cross-platform-actions/action@v1.4.0
        with:
          operating_system: ${{ matrix.os }}
          architecture: ${{ matrix.vm-arch }}
          version: ${{ matrix.vm-version }}
          shell: sh
          environment_variables: VERSION FINAL_ZIP_NAME
          run: |
            uname -a
            if [ "$(uname -s)" = OpenBSD ]; then
              doas pkg_add -I gmake zip python3 readline || sudo pkg_add -I gmake zip python3 readline
              RL="READLINE_PREFIX=/usr/local"
            else
              pkgman install -y gcc make zip readline_devel python3 || true
              RL=
            fi
            # GNU make is needed (OpenBSD: gmake, Haiku: make). Skip the
            # generated sources' tools: the committed gen/ is used.
            if command -v gmake >/dev/null 2>&1; then MAKE=gmake; else MAKE=make; fi
            $MAKE HAVE_GEN_TOOLS=no $RL
            strip bin/v32sim
            ./bin/v32sim --version
            $MAKE test HAVE_GEN_TOOLS=no $RL
            $MAKE dist HAVE_GEN_TOOLS=no $RL DISTZIP="$FINAL_ZIP_NAME"

      # --- STAGE ZIP INTERNALLY ---
      - name: Upload Compressed Target Release Artifact
        uses: actions/upload-artifact@v4
        with:
          # Modified to avoid naming collisions across jobs
          name: ${{ env.PROJECT_NAME }}-package-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.FINAL_ZIP_NAME }}
          retention-days: ${{ fromJson(env.RETENTION_DAYS) }}

  # The release page. For a `release` run this attaches every platform's zip
  # to a GitHub release "v<VERSION>", together with a SHA256SUMS.txt and the
  # text of .github/release-notes.md (its @VERSION@ becomes the version).
  #
  #   - The release is created as a DRAFT, visible only to people who can
  #     write to the repository, so the text and the zips can be reviewed
  #     before anyone sees them: press "Publish release" on the Releases
  #     page. Start the run with `publish_release` ticked to publish at once.
  #   - It is created for the commit that was built (target_commitish), not
  #     for whatever the default branch holds when the draft is published:
  #     the tag v<VERSION> is made at that commit.
  #   - A -dev version is marked a pre-release (never "Latest").
  #   - Running it again for the same version updates that release and
  #     replaces the zips of the same names.
  #   - This is the only job that can write to the repository (the other
  #     jobs get the read-only default above). A release made with the
  #     built-in GITHUB_TOKEN does not itself start other workflows (an
  #     `on: release` workflow would not fire); GitHub does this on purpose.
  release:
    name: ${{ inputs.publish_release && 'Publish Release' || 'Create Draft Release' }}
    needs: [version, build]
    if: inputs.build_type == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Only .github/ (the release text) is needed from the repository.
      - name: Checkout the release text
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Download all zip packages from build jobs
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ${{ env.PROJECT_NAME }}-package-*
          merge-multiple: true

      # The OpenBSD and Haiku packages are optional (their job may fail
      # without failing the run); every other target must be here, or the
      # release would silently go out missing a platform.
      - name: Check the Packages
        shell: bash
        run: |
          MISSING=0
          for target in macos-x86_64 macos-arm64 linux-x86_64 linux-arm64 linux-armv7-rpi linux-armv8-rpi; do
            zip="artifacts/${{ env.PROJECT_NAME }}-${VERSION}-${target}.zip"
            [ -f "$zip" ] || { echo "::error::$zip is missing"; MISSING=1; }
          done
          [ "$MISSING" = 0 ]
          ls -l artifacts

      - name: Write the Checksums and the Release Text
        shell: bash
        run: |
          [ -f .github/release-notes.md ] || { echo "::error file=.github/release-notes.md::the release text is missing"; exit 1; }
          (cd artifacts && sha256sum -- *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          sed "s|@VERSION@|${VERSION}|g" .github/release-notes.md > release-notes.md

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "${{ env.PROJECT_NAME }} Release v${{ needs.version.outputs.version }}"
          body_path: release-notes.md
          draft: ${{ !inputs.publish_release }}
          prerelease: ${{ contains(needs.version.outputs.version, '-dev') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
